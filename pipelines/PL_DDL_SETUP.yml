resources:
  jobs:
    ddl_setup:
      name: "[${var.environment}] DDL Setup - Sales Intelligence"
      tasks:
        - task_key: preqin_audit_log_table
          sql_task:
            file:
              path: ../sql/ddl/SQL_PREQIN_API_AUDIT_LOG_TABLE_SETUP.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: preqin_watermark_table
          sql_task:
            file:
              path: ../sql/ddl/SQL_PREQIN_API_WATERMARK_TABLE_SETUP.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: salesforce_slr_views
          sql_task:
            file:
              path: ../sql/ddl/SQL_SALESFORCE_SLR_VIEWS.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: ws_campaign_silver_table
          sql_task:
            file:
              path: ../sql/ddl/SQL_WS_CAMPAIGN_SILVER_TABLE_SETUP.sql
            warehouse_id: ${var.warehouse_id}
