resources:
  jobs:
    PL_PREQIN_ORCHESTRATOR:
      name: PL_PREQIN_ORCHESTRATOR
      email_notifications:
        on_failure:
          - ext_tkashyap@cimgroup.com
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
      tasks:
        - task_key: Generate_OAuth_Token
          notebook_task:
            notebook_path: ../notebooks/ingestion/NB_PREQIN_AUTH_TOKEN_GENERATION
          description: "Step 1: Generate auth token."
        - task_key: Get_Active_Endpoints
          depends_on:
            - task_key: Generate_OAuth_Token
          sql_task:
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
            file:
              path: ../sql/dml/SQL_PREQIN_ACTIVE_ENDPOINTS.sql
            warehouse_id: ${var.warehouse_id}
          description: "Step 2: Returns one row per endpoint. Output rows feed For Each."
        - task_key: for_each_endpoint
          depends_on:
            - task_key: Get_Active_Endpoints
          for_each_task:
            inputs: "{{tasks.Get_Active_Endpoints.output.rows}}"
            concurrency: 10
            task:
              task_key: Process_Endpoint_Pipeline
              run_job_task:
                job_id: ${resources.jobs.PL_PREQIN_API_TO_VOL_DBX.id}
                job_parameters:
                  access_token: "{{tasks.Generate_OAuth_Token.values.access_token}}"
                  catalog: "{{job.parameters.catalog}}"
                  endpoint_data: "{{input}}"
                  schema: "{{job.parameters.schema}}"
          description: "Step 3: For Each endpoint row → calls sub-job with 3 tasks:
            process_single_endpoint → update_watermark → insert_audit_log."
        - task_key: Bronze_Autoloader_Deals
          depends_on:
            - task_key: for_each_endpoint
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.PL_PREQIN_DEALS_VOL_TO_BRZ.id}
            full_refresh: false
        - task_key: Bronze_To_Silver_Deals
          depends_on:
            - task_key: Bronze_Autoloader_Deals
          pipeline_task:
            pipeline_id: ${resources.pipelines.PL_PREQIN_DEALS_BRZ_TO_SCD2.id}
            full_refresh: false
        - task_key: Bronze_Autoloader_Funds
          depends_on:
            - task_key: for_each_endpoint
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.PL_PREQIN_FUNDS_VOL_TO_BRZ.id}
            full_refresh: false
        - task_key: Bronze_To_Silver_Funds
          depends_on:
            - task_key: Bronze_Autoloader_Funds
          pipeline_task:
            pipeline_id: ${resources.pipelines.PL_PREQIN_FUNDS_BRZ_TO_SCD2.id}
            full_refresh: false
        - task_key: Bronze_Autoloader_Others
          depends_on:
            - task_key: for_each_endpoint
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.PL_PREQIN_OTHERS_VOL_TO_BRZ.id}
            full_refresh: false
        - task_key: Bronze_To_Silver_Others
          depends_on:
            - task_key: Bronze_Autoloader_Others
          pipeline_task:
            pipeline_id: ${resources.pipelines.PL_PREQIN_OTHERS_BRZ_TO_SCD2.id}
            full_refresh: false
        - task_key: Failed_Endpoints_Alert
          depends_on:
            - task_key: Bronze_To_Silver_Others
            - task_key: Bronze_To_Silver_Funds
            - task_key: Bronze_To_Silver_Deals
          run_if: ALL_DONE
          alert_task:
            alert_id: "655311453290286"
            warehouse_id: 078e0c6edb871666
            subscribers:
              - user_name: ext_tkashyap@cimgroup.com
              - user_name: ext_tlakhotia@cimgroup.com
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: bronze_preqin
      performance_target: PERFORMANCE_OPTIMIZED
