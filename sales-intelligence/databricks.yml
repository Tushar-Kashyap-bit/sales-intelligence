bundle:
  name: cim-sales-intelligence

targets:
  dev:
    default: true
    workspace:
      host: ${DATABRICKS_HOST_DEV}
    variables:
      environment: DEV
      catalog: dev
      warehouse_id: c4458a185ce3b072

  uat:
    workspace:
      host: ${DATABRICKS_HOST_UAT}
    variables:
      environment: UAT
      catalog: uat
      warehouse_id: ${UAT_WAREHOUSE_ID}

  prod:
    workspace:
      host: ${DATABRICKS_HOST_PROD}
    variables:
      environment: PROD
      catalog: prod
      warehouse_id: ${PROD_WAREHOUSE_ID}

include:
  - ./variables.yml
  - ./pipelines/*.yml
