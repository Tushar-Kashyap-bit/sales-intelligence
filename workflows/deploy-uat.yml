# Deploy Preqin pipelines to UAT Databricks workspace
name: Deploy to UAT

on:
  push:
    branches: [staging]
    paths:
      - "pipelines/**"
      - "notebooks/**"
      - "sql/**"
      - "scripts/**"
      - "databricks.yml"
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_UAT }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_UAT }}
  ENVIRONMENT: uat
  CATALOG: uat
  WORKSPACE_PATH: /Workspace/Shared/Sales/Preqin

jobs:
  validate:
    name: Validate Pipeline Definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target uat

  deploy-notebooks:
    name: Deploy Notebooks & SQL
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy ingestion notebooks
        run: |
          databricks workspace import-dir ./notebooks/ingestion \
            "${{ env.WORKSPACE_PATH }}/notebooks/ingestion" --overwrite

      - name: Deploy transform notebooks
        run: |
          databricks workspace import-dir ./notebooks/transform \
            "${{ env.WORKSPACE_PATH }}/notebooks/transform" --overwrite

      - name: Deploy SQL scripts
        run: |
          databricks workspace import-dir ./sql/dml \
            "${{ env.WORKSPACE_PATH }}/sql/dml" --overwrite

  deploy-pipelines:
    name: Deploy Pipelines to UAT
    runs-on: ubuntu-latest
    needs: deploy-notebooks
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to UAT
        run: databricks bundle deploy --target uat

  run-integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-pipelines
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy and run integration tests
        run: |
          databricks workspace import-dir ./tests/integration \
            "${{ env.WORKSPACE_PATH }}/tests/integration" --overwrite
