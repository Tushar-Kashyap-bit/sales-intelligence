# Deploy Preqin pipelines to PROD Databricks workspace
name: Deploy to PROD

on:
  push:
    branches: [main]
    paths:
      - "pipelines/**"
      - "notebooks/**"
      - "sql/**"
      - "scripts/**"
      - "databricks.yml"
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type 'deploy-prod' to confirm production deployment"
        required: true

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
  ENVIRONMENT: prod
  CATALOG: prod
  WORKSPACE_PATH: /Workspace/Shared/Sales/Preqin

jobs:
  validate:
    name: Validate Pipeline Definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "deploy-prod" ]; then
            echo "::error::Deployment confirmation failed. Type 'deploy-prod' to confirm."
            exit 1
          fi

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prod

  deploy-notebooks:
    name: Deploy Notebooks & SQL
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy ingestion notebooks
        run: |
          databricks workspace import-dir ./notebooks/ingestion \
            "${{ env.WORKSPACE_PATH }}/notebooks/ingestion" --overwrite

      - name: Deploy transform notebooks
        run: |
          databricks workspace import-dir ./notebooks/transform \
            "${{ env.WORKSPACE_PATH }}/notebooks/transform" --overwrite

      - name: Deploy SQL scripts
        run: |
          databricks workspace import-dir ./sql/dml \
            "${{ env.WORKSPACE_PATH }}/sql/dml" --overwrite

  deploy-pipelines:
    name: Deploy Pipelines to PROD
    runs-on: ubuntu-latest
    needs: deploy-notebooks
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to PROD
        run: databricks bundle deploy --target prod

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: deploy-pipelines
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-pipelines.result }}" == "success" ]; then
            echo "✅ PROD deployment successful"
          else
            echo "❌ PROD deployment failed"
            exit 1
          fi
