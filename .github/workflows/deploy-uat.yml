# Deploy Preqin pipelines to UAT Databricks workspace
name: Deploy to UAT

on:
  push:
    branches: [staging]
    paths:
      - "pipelines/**"
      - "notebooks/**"
      - "sql/**"
      - "scripts/**"
      - "databricks.yml"
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_UAT }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_UAT }}
  ENVIRONMENT: uat
  CATALOG: uat

jobs:
  validate:
    name: Validate Pipeline Definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target uat

  deploy-bundle:
    name: Deploy Bundle to UAT
    runs-on: ubuntu-latest
    needs: validate
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to UAT
        run: databricks bundle deploy --target uat

  run-integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-bundle
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Run integration tests
        run: |
          # Integration tests will be managed by the bundle
          echo "Integration tests configured in bundle"
