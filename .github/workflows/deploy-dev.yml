# Deploy Preqin pipelines to DEV Databricks workspace
name: Deploy to DEV

on:
  push:
    branches: [develop]
    paths:
      - "pipelines/**"
      - "notebooks/**"
      - "sql/**"
      - "scripts/**"
      - "databricks.yml"
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
  ENVIRONMENT: dev
  CATALOG: dev
  WORKSPACE_PATH: /Workspace/Users/ext_tkashyap@cimgroup.com/Sales/Preqin

jobs:
  validate:
    name: Validate Pipeline Definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target dev

  deploy-notebooks:
    name: Deploy Notebooks & SQL
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy ingestion notebooks
        run: |
          databricks workspace import-dir ./notebooks/ingestion \
            "${{ env.WORKSPACE_PATH }}/notebooks/ingestion" --overwrite

      - name: Deploy transform notebooks
        run: |
          databricks workspace import-dir ./notebooks/transform \
            "${{ env.WORKSPACE_PATH }}/notebooks/transform" --overwrite

      - name: Deploy SQL scripts
        run: |
          databricks workspace import-dir ./sql/dml \
            "${{ env.WORKSPACE_PATH }}/sql/dml" --overwrite

  deploy-pipelines:
    name: Deploy Pipelines to DEV
    runs-on: ubuntu-latest
    needs: deploy-notebooks
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to DEV
        run: databricks bundle deploy --target dev

  run-tests:
    name: Run Data Quality Tests
    runs-on: ubuntu-latest
    needs: deploy-pipelines
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Run unit tests
        run: |
          databricks workspace import-dir ./tests/unit \
            "${{ env.WORKSPACE_PATH }}/tests/unit" --overwrite
